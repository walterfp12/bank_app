name: bank_app
description: "Aplicación bancaria móvil - BankApp"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # Navegación
  go_router: ^14.8.1
  # Estado
  provider: ^6.1.4
  # Íconos y UI
  flutter_svg: ^2.0.17
  # Formateo de moneda/fechas
  intl: ^0.20.2
  # Almacenamiento local
  shared_preferences: ^2.5.3
  # HTTP
  http: ^1.3.0
  # Animaciones
  animations: ^2.0.11
  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
